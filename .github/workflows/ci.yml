name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: luphina
          POSTGRES_PASSWORD: luphina
          POSTGRES_DB: luphina_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U luphina"
          --health-interval 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Empty means the SQLite default
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://luphina:luphina@localhost:5432/luphina_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Migrations match models
        env:
          LUPHINA_DATA_DIR: ${{ runner.temp }}/luphina
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t luphina-api ./backend
      - run: docker build -t luphina-web ./frontend
