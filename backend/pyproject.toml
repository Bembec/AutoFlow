[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoflow"
version = "0.44.0"
description = "AI-powered business workflow automation — backend and workflow engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic",
    "anthropic",
    "croniter",
    "cryptography",
    "email-validator",
    "fastapi",
    "google-genai",
    "psycopg[binary]",
    "pypdf",
    "python-multipart",
    "pydantic>=2",
    "python-dotenv",
    "requests",
    "sqlalchemy>=2",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
autoflow = "autoflow.pipeline:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoflow = ["storage/migrations/*.mako", "storage/migrations/*.py", "storage/migrations/versions/*.py", "billing/*.json", "help_docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
