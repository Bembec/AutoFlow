[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoflow"
version = "0.8.0"
description = "AI-powered business workflow automation — backend and workflow engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "google-genai",
    "pydantic>=2",
    "python-dotenv",
    "requests",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
autoflow = "autoflow.pipeline:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
